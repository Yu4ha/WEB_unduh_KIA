
<h2 class="sr-only">Carousel screenshot aplikasi dengan frame portrait</h2>

<div style="border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-lg); padding: 12px; background: var(--color-background-primary);">

  <div style="position: relative; border-radius: var(--border-radius-md); overflow: hidden; background: var(--color-background-secondary); aspect-ratio: 9/19.5;">
    <div id="slideWrapper" style="display: flex; height: 100%; transition: transform 0.4s ease;">
    </div>

    <button id="btnPrev" aria-label="Sebelumnya" style="position: absolute; left: 10px; top: 50%; transform: translateY(-50%); background: rgba(0,0,0,0.35); border: none; border-radius: 50%; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 10; color: #fff; padding: 0;">
      <i class="ti ti-chevron-left" style="font-size: 16px;"></i>
    </button>
    <button id="btnNext" aria-label="Selanjutnya" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: rgba(0,0,0,0.35); border: none; border-radius: 50%; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 10; color: #fff; padding: 0;">
      <i class="ti ti-chevron-right" style="font-size: 16px;"></i>
    </button>

    <div id="dotContainer" style="position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); display: flex; gap: 6px; z-index: 10;"></div>
  </div>

  <p id="carouselTitle" style="margin: 12px 0 4px; text-align: center; font-weight: 500; font-size: 15px; color: var(--color-text-primary);"></p>
  <p id="carouselDesc" style="margin: 0 0 4px; text-align: center; font-size: 13px; color: var(--color-text-secondary); line-height: 1.5;"></p>
  <p id="slideCounter" style="margin: 4px 0 0; text-align: center; font-size: 12px; color: var(--color-text-tertiary);"></p>
</div>

<script>
const slides = [
  { title: "Login/Regist Page", desc: "Buat atau Login akun mu sebelum menggunakan Aplikasi" },
  { title: "Buat Akun", desc: "Daftarkan akun mu dan simpan progres bulanannya" },
  { title: "Lupa Password?", desc: "Reset password mu dengan memasukkan email yang kamu daftarkan agar kami bisa mengirimkan kode OTP ke kamu" },
  { title: "Penilaian", desc: "Input, edit, dan simpan nilai siswa secara massal." },
  { title: "Absensi", desc: "Kelola kehadiran siswa dan perhitungan nilai kehadiran secara massal." },
  { title: "Rekap & Export Nilai", desc: "Rekap nilai semester/kelas dan export laporan ke Excel." },
  { title: "Laporan Kelulusan", desc: "Monitoring kelulusan siswa lengkap dengan ranking dan status." },
  { title: "Laporan Kelulusan", desc: "Monitoring kelulusan siswa lengkap dengan ranking dan status." },
  { title: "Laporan Kelulusan", desc: "Monitoring kelulusan siswa lengkap dengan ranking dan status." },
  { title: "Laporan Kelulusan", desc: "Monitoring kelulusan siswa lengkap dengan ranking dan status." },
  { title: "Laporan Kelulusan", desc: "Monitoring kelulusan siswa lengkap dengan ranking dan status." },
  { title: "Laporan Kelulusan", desc: "Monitoring kelulusan siswa lengkap dengan ranking dan status." },
];

const imgPaths = [
  "./assets/file_21---c98fa5e5-44a3-43e1-add0-ef27ee6abbc3.jpg",
  "./assets/file_20---87417e5a-2cda-44b7-9c14-94d95858497e.jpg",
  "./assets/file_19---7f22086a-79e6-422c-8e1c-385e7177ba7c.jpg",
  "./assets/file_18---acf122e9-535d-480f-94cc-0c10947d4acb.jpg",
  "./assets/file_17---c8624750-99ed-432d-9347-fb69b7343fa0.jpg",
  "./assets/file_16---25dd7b8c-83f8-434e-bc10-66fba06a4c1b.jpg",
  "./assets/file_15---2852365a-88fb-4bd9-8bec-d220a8720197.jpg",
  "./assets/file_14---99e847c3-0c58-4876-8569-09282b9e9135.jpg",
  "./assets/file_13---db736ede-af15-4c8a-ad23-bdc26e0a8477.jpg",
  "./assets/file_12---e72b5777-234a-4881-959b-2b6df4856a4c.jpg",
  "./assets/file_11---910d242f-2298-47a8-b761-d67fa932473c.jpg",
  "./assets/file_10---6de79ca8-722b-41d7-9294-e2bd45f09519.jpg",
];

let current = 0;
const total = slides.length;
const wrapper = document.getElementById('slideWrapper');
const dotContainer = document.getElementById('dotContainer');

slides.forEach((s, i) => {
  const slide = document.createElement('div');
  slide.style.cssText = 'min-width: 100%; flex-shrink: 0; height: 100%;';
  const img = document.createElement('img');
  img.src = imgPaths[i];
  img.alt = s.title;
  img.style.cssText = 'width: 100%; height: 100%; object-fit: cover; display: block;';
  img.onerror = function() {
    this.style.display = 'none';
    const ph = document.createElement('div');
    ph.style.cssText = 'width:100%; height:100%; display:flex; align-items:center; justify-content:center; background:var(--color-background-secondary); color:var(--color-text-secondary); font-size:13px; text-align:center; padding:8px;';
    ph.textContent = s.title;
    slide.appendChild(ph);
  };
  slide.appendChild(img);
  wrapper.appendChild(slide);

  const dot = document.createElement('span');
  dot.style.cssText = 'width:7px; height:7px; border-radius:50%; background:rgba(255,255,255,0.45); cursor:pointer; transition:background 0.2s, transform 0.2s; display:inline-block;';
  dot.addEventListener('click', () => goTo(i));
  dotContainer.appendChild(dot);
});

function updateUI() {
  wrapper.style.transform = `translateX(-${current * 100}%)`;
  document.getElementById('carouselTitle').textContent = slides[current].title;
  document.getElementById('carouselDesc').textContent = slides[current].desc;
  document.getElementById('slideCounter').textContent = `${current + 1} / ${total}`;
  dotContainer.querySelectorAll('span').forEach((d, i) => {
    d.style.background = i === current ? 'rgba(255,255,255,0.95)' : 'rgba(255,255,255,0.4)';
    d.style.transform = i === current ? 'scale(1.4)' : 'scale(1)';
  });
}

function goTo(idx) {
  current = (idx + total) % total;
  updateUI();
}

document.getElementById('btnPrev').addEventListener('click', () => goTo(current - 1));
document.getElementById('btnNext').addEventListener('click', () => goTo(current + 1));

let autoplay = setInterval(() => goTo(current + 1), 4000);
wrapper.parentElement.addEventListener('mouseenter', () => clearInterval(autoplay));
wrapper.parentElement.addEventListener('mouseleave', () => { autoplay = setInterval(() => goTo(current + 1), 4000); });

let touchStartX = 0;
wrapper.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; });
wrapper.addEventListener('touchend', e => {
  const diff = touchStartX - e.changedTouches[0].clientX;
  if (Math.abs(diff) > 30) goTo(diff > 0 ? current + 1 : current - 1);
});

updateUI();
</script>
